<!doctype html>
<html lang="es" data-tema="rojo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Splendida · Vera Pizza Napoletana</title>
  <meta name="description" content="La Splendida, vera pizza napoletana. Muy pronto.">
  <meta property="og:title" content="La Splendida · Pronto">
  <meta property="og:description" content="Vera pizza napoletana. Muy pronto.">
  <meta property="og:image" content="https://www.lasplendida.cl/logo.png">
  <meta name="theme-color" content="#C2121F">
  <link rel="icon" href="logo.png">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try {
      if (localStorage.getItem("tema") === "crema") {
        document.documentElement.dataset.tema = "crema";
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #C2121F;
      --principal: #FBF1DC;
      --secundario: #FBF1DC;
    }
    [data-tema="crema"] {
      --fondo: #FBEED5;
      --principal: #D11219;
      --secundario: #234F34;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--fondo);
      color: var(--principal);
      font-family: "Montserrat", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 16px;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .pronto {
      font-family: "Lobster", cursive;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .logo {
      width: 100%;
      height: auto;
      display: block;
    }
    .logo-crema { display: none; }
    [data-tema="crema"] .logo-rojo { display: none; }
    [data-tema="crema"] .logo-crema { display: block; }
    .botones {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .contacto {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border: 2px solid var(--principal);
      border-radius: 999px;
      color: var(--principal);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s, border-color 0.3s;
    }
    .contacto:hover, .contacto:focus-visible {
      background: var(--principal);
      color: var(--fondo);
      outline: none;
    }
    .correo {
      font-size: 0.9rem;
      opacity: 0.85;
      color: var(--secundario);
    }
    .correo a { color: inherit; }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.75rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
      color: var(--secundario);
    }

    /* Switch de color */
    .tema {
      position: fixed;
      top: 1rem;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--principal);
    }
    .tema .pista {
      position: relative;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      border: 2px solid var(--principal);
      transition: border-color 0.3s;
    }
    .tema .perilla {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--principal);
      transition: transform 0.25s, background-color 0.3s;
    }
    .tema[aria-checked="true"] .perilla { transform: translateX(22px); }
    .tema:focus-visible { outline: 2px solid var(--principal); outline-offset: 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <button class="tema" type="button" role="switch" aria-checked="false" aria-label="Diseño crema">
    <span class="pista"><span class="perilla"></span></span>
  </button>

  <main>
    <p class="pronto">Pronto</p>
    <h1>
      <img class="logo logo-rojo" src="logo.png" alt="La Splendida — Vera Pizza Napoletana" width="933" height="247">
      <img class="logo logo-crema" src="logo-crema.png" alt="La Splendida — Vera Pizza Napoletana" width="1114" height="295">
    </h1>
    <div class="botones">
      <a class="contacto" href="mailto:administracion@lasplendida.cl">Contáctanos</a>
      <a class="contacto" href="https://www.instagram.com/pizzeria_lasplendida/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
    </div>
    <p class="correo"><a href="mailto:administracion@lasplendida.cl">administracion@lasplendida.cl</a> · <a href="https://www.instagram.com/pizzeria_lasplendida/" target="_blank" rel="noopener">@pizzeria_lasplendida</a></p>
  </main>
  <footer>© 2026 La Splendida</footer>

  <script>
    const raiz = document.documentElement;
    const boton = document.querySelector(".tema");
    const colorBarra = document.querySelector('meta[name="theme-color"]');

    function aplicar(tema) {
      raiz.dataset.tema = tema;
      boton.setAttribute("aria-checked", tema === "crema");
      colorBarra.content = tema === "crema" ? "#FBEED5" : "#C2121F";
    }

    aplicar(raiz.dataset.tema);
    boton.addEventListener("click", () => {
      const tema = raiz.dataset.tema === "crema" ? "rojo" : "crema";
      aplicar(tema);
      try { localStorage.setItem("tema", tema); } catch (e) {}
    });
  </script>
</body>
</html>

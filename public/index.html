  <style>
    :root {
      --rojo: #C2121F;
      --crema: #FBF1DC;
      --vino: #5A0A10;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--rojo);
      color: var(--crema);
      font-family: "Montserrat", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 16px;
      text-align: center;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }
    .pronto {
      font-family: "Lobster", cursive;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1;
      color: var(--crema);
      letter-spacing: 0.02em;
    }
    .logo {
      width: 100%;
      height: auto;
      display: block;
    }
    .botones {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .contacto {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border: 2px solid var(--crema);
      border-radius: 999px;
      color: var(--crema);
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.9rem;
      transition: background 0.2s, color 0.2s;
    }
    .contacto:hover, .contacto:focus-visible {
      background: var(--crema);
      color: var(--rojo);
      outline: none;
    }
    .correo {
      font-size: 0.9rem;
      opacity: 0.85;
    }
    .correo a { color: inherit; }
    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.75rem;
      opacity: 0.6;
      letter-spacing: 0.1em;
    }
  </style>
</head>
